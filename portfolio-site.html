<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iOS Native App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Portfolio | Bill Breaker</title>
    <style>
        /* Basic styling for the gate */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f4f9; }
        #gate-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .gate-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; }
        input { padding: 12px; width: 80%; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        button { padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%;}
        
        /* Hide the app content initially */
        #app-container { display: none; padding: 20px; }
    </style>
</head>
<body>

    <!-- The Password Gate -->
    <div id="gate-container">
        <div class="gate-box">
            <h2>Portfolio Access</h2>
            <p style="color: #666; font-size: 14px;">Enter keyword to view project</p>
            <input type="password" id="keyword-input" placeholder="Keyword" onkeypress="handleEnter(event)">
            <button onclick="checkKeyword()">Unlock</button>
            <p id="error-msg" style="color: red; display: none; font-size: 14px; margin-top: 10px;">Incorrect keyword.</p>
        </div>
    </div>

    <!-- The Bill Breaker App -->
    <div id="app-container">
        <!-- ALL YOUR BILL BREAKER HTML GOES HERE -->
        <h2>Bill Breaker Tool</h2>
        <p>Your calculator UI will render here...</p>
        <button onclick="lockApp()" style="background: #ff3b30; margin-top: 20px;">Lock Portfolio</button>
    </div>

    <script>
        // Set your secret keyword here
        const SECRET_KEYWORD = "teller"; 

        // Check if the device is already authenticated
        window.onload = function() {
            if (localStorage.getItem("portfolio_unlocked") === "true") {
                showApp();
            }
        };

        function checkKeyword() {
            const input = document.getElementById("keyword-input").value.toLowerCase();
            if (input === SECRET_KEYWORD) {
                localStorage.setItem("portfolio_unlocked", "true"); // Saves session
                showApp();
            } else {
                document.getElementById("error-msg").style.display = "block";
                document.getElementById("keyword-input").value = "";
            }
        }

        function handleEnter(e) {
            if (e.key === "Enter") checkKeyword();
        }

        function showApp() {
            document.getElementById("gate-container").style.display = "none";
            document.getElementById("app-container").style.display = "block";
        }

        // Optional: A way to lock it back up
        function lockApp() {
            localStorage.removeItem("portfolio_unlocked");
            location.reload(); // Refresh to show the gate
        }
    </script>
</body>
</html>
